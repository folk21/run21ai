openapi: 3.1.0
info:
  title: Run21AI REST API
  version: 0.1.0
  description: Dispatcher-driven tool execution API exposed by the Ktor REST runtime.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        '200':
          description: Backend process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Readiness check
      operationId: getReady
      responses:
        '200':
          description: Runtime is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Runtime is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/tools:
    get:
      summary: List registered tools
      operationId: listTools
      responses:
        '200':
          description: Registered tool descriptors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolDescriptor'
  /v1/tools/{code}:
    get:
      summary: Get a registered tool descriptor
      operationId: getTool
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: formula.evaluate
      responses:
        '200':
          description: Tool descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDescriptor'
        '404':
          description: Tool is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
  /v1/tool-requests/resolve:
    post:
      summary: Resolve input into a ToolRequest without executing it
      operationId: resolveToolRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
            examples:
              structuredFormula:
                $ref: '#/components/examples/StructuredFormulaRequest'
              prompt:
                $ref: '#/components/examples/PromptRequest'
      responses:
        '200':
          description: Dispatcher-chain result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '400':
          description: Invalid HTTP request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
  /v1/executions:
    post:
      summary: Execute structured or prompt-like input
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
            examples:
              structuredFormula:
                $ref: '#/components/examples/StructuredFormulaRequest'
      responses:
        '200':
          description: Canonical tool result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
        '400':
          description: Invalid HTTP request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
components:
  examples:
    StructuredFormulaRequest:
      summary: Structured formula evaluation request
      value:
        type: structured
        toolCode: formula.evaluate
        implementationCode: formula-evalex-v1
        input:
          expression: a + b
          variables:
            a: 10
            b: 11
        actor:
          id: manual-user
          type: human
          displayName: Manual User
        source:
          type: api
          name: openapi
        correlation:
          correlationId: openapi-example
    PromptRequest:
      summary: Prompt-like request that requires a raw dispatcher
      value:
        type: prompt
        prompt: Evaluate formula a + b with a = 10 and b = 11.
        actor:
          id: manual-user
          type: human
        source:
          type: api
          name: openapi
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required: [status, tools, executors, implementations, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        tools:
          type: integer
          minimum: 0
        executors:
          type: integer
          minimum: 0
        implementations:
          type: integer
          minimum: 0
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    ReadinessCheck:
      type: object
      required: [name, status, details]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ready, not_ready]
        details:
          type: object
          additionalProperties: true
    ExecutionRequest:
      type: object
      required: [type, actor, source]
      properties:
        type:
          type: string
          enum: [structured, prompt, raw]
          default: structured
        toolCode:
          type: string
          nullable: true
          example: formula.evaluate
        implementationCode:
          type: string
          nullable: true
          example: formula-evalex-v1
        input:
          type: object
          additionalProperties: true
          default: {}
        prompt:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          default: {}
        attributes:
          type: object
          additionalProperties: true
          default: {}
        actor:
          $ref: '#/components/schemas/Actor'
        source:
          $ref: '#/components/schemas/Source'
        correlation:
          $ref: '#/components/schemas/Correlation'
        version:
          $ref: '#/components/schemas/Version'
        metadata:
          type: object
          additionalProperties: true
          default: {}
    Actor:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [human, agent, system]
        displayName:
          type: string
          nullable: true
    Source:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [api, cli, ui, test, system]
        name:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          default: {}
    Correlation:
      type: object
      properties:
        executionId:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        causationId:
          type: string
          nullable: true
    Version:
      type: object
      properties:
        definitionVersion:
          type: string
          nullable: true
        implementationVersion:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          default: {}
    ResolveResponse:
      type: object
      required: [status, trace]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        request:
          $ref: '#/components/schemas/ToolRequest'
        error:
          $ref: '#/components/schemas/ToolError'
        trace:
          type: array
          items:
            $ref: '#/components/schemas/DispatcherTraceStep'
    ToolDescriptor:
      type: object
      required: [code, name, description, status, inputSchema, outputSchema]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planned, in_progress, done]
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
    ToolRequest:
      type: object
      required: [targetTool, inputPayload, actor, source, correlation]
      properties:
        targetTool:
          type: string
        targetImplementation:
          type: string
          nullable: true
        inputPayload:
          type: object
          additionalProperties: true
        actor:
          $ref: '#/components/schemas/Actor'
        source:
          $ref: '#/components/schemas/Source'
        correlation:
          $ref: '#/components/schemas/Correlation'
        version:
          $ref: '#/components/schemas/Version'
        metadata:
          type: object
          additionalProperties: true
          default: {}
    ToolResult:
      type: object
      required: [status, outputPayload, auditMetadata, metadata]
      properties:
        status:
          type: string
          enum: [succeeded, failed, rejected]
        outputPayload:
          type: object
          additionalProperties: true
          default: {}
        error:
          $ref: '#/components/schemas/ToolError'
        auditMetadata:
          $ref: '#/components/schemas/AuditMetadata'
        metadata:
          type: object
          additionalProperties: true
          default: {}
    ToolError:
      type: object
      nullable: true
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          default: {}
    AuditMetadata:
      type: object
      required: [actor, source, dispatcherTrace, tool, correlation, startedAt, completedAt, metadata]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        source:
          $ref: '#/components/schemas/Source'
        dispatcherTrace:
          type: array
          items:
            $ref: '#/components/schemas/DispatcherTraceStep'
        tool:
          $ref: '#/components/schemas/ToolSnapshot'
        implementation:
          $ref: '#/components/schemas/ImplementationSnapshot'
        version:
          $ref: '#/components/schemas/Version'
        correlation:
          $ref: '#/components/schemas/Correlation'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          default: {}
    DispatcherTraceStep:
      type: object
      required: [dispatcherCode, outcome, metadata]
      properties:
        dispatcherCode:
          type: string
        outcome:
          type: string
          enum: [accepted, enriched, rejected, passed]
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        error:
          $ref: '#/components/schemas/ToolError'
        inputSummary:
          type: string
          nullable: true
        outputSummary:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          default: {}
    ToolSnapshot:
      type: object
      required: [code, name, status, inputSchema, outputSchema]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [planned, in_progress, done]
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
    ImplementationSnapshot:
      type: object
      nullable: true
      required: [implementationCode, toolCode, type, status, runtimeMetadata]
      properties:
        implementationCode:
          type: string
        toolCode:
          type: string
        type:
          type: string
          enum: [jvm_class, formula, spreadsheet, http_adapter, local_service, custom]
        version:
          type: string
          nullable: true
        status:
          type: string
          enum: [planned, in_progress, done]
        runtimeMetadata:
          type: object
          additionalProperties: true
          default: {}
