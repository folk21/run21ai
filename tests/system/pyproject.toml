[project]
name = "run21ai-system-tests"
version = "0.1.0"
description = "System tests for Run21AI REST API and Rust CLI contracts"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
